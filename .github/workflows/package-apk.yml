
name: Package APK for ChatGPT

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source file
        run: |
          test -f crackme.zip
          ls -lh crackme.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crackme-transfer
          path: crackme.zip
          if-no-files-found: error
          retention-days: 7
