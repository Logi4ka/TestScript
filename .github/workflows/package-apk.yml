
name: Publish crackme binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish binary as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view crackme-analysis >/dev/null 2>&1; then
            gh release upload crackme-analysis crackme.so --clobber
          else
            gh release create crackme-analysis crackme.so \
              --title "Crackme binary" \
              --notes "Binary published for analysis"
          fi
